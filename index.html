<body><header><h1 id="heading">Player contínuo — Conhecimentos Específicos</h1><p id="subtitle">Ordem por base, incidência e dependência conceitual; questões específicas valem 2,5 pontos. Vídeos originais e intervalos auditados.</p></header><nav><button id="specific" class="active">Específicas</button><button id="general">Gerais</button><a href="ROTEIRO_ESTUDO_DATAPREV_V2.html">Roteiro completo</a><a href="MAPA_VIDEO_TEC_V2.csv">Mapa vídeo → TEC</a></nav><main><iframe id="player" src="PLAYER_ESPECIFICAS_V2.html" title="Player Dataprev"></iframe></main>
<script>const frame=document.querySelector('#player'),specific=document.querySelector('#specific'),general=document.querySelector('#general'),heading=document.querySelector('#heading'),subtitle=document.querySelector('#subtitle');function show(which){const s=which==='specific';frame.src=s?'PLAYER_ESPECIFICAS_V2.html':'PLAYER_GERAIS_V2.html';specific.classList.toggle('active',s);general.classList.toggle('active',!s);heading.textContent=s?'Player contínuo — Conhecimentos Específicos':'Player contínuo — Conhecimentos Gerais';subtitle.textContent=s?'Ordem por base, incidência e dependência conceitual; questões específicas valem 2,5 pontos. Vídeos originais e intervalos auditados.':'Ordem por disciplina e dependência; módulos podem ser pulados quando o assunto já estiver dominado. Vídeos originais e intervalos auditados.';history.replaceState(null,'',s?'#especificas':'#gerais')}specific.onclick=()=>show('specific');general.onclick=()=>show('general');if(location.hash==='#gerais')show('general');</script></body></html>
