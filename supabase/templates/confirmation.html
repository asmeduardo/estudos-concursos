<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;background:#eef2ff;font-family:Arial,sans-serif;color:#172033">
    <main style="max-width:560px;margin:32px auto;background:#ffffff;border-radius:16px;padding:36px">
      <p style="margin:0 0 20px;color:#5b4bd8;font-size:22px;font-weight:700">Nexame</p>
      <h1 style="margin:0 0 14px;font-size:24px">Confirme seu e-mail</h1>
      <p style="line-height:1.6">Use este código para concluir seu cadastro. Ele expira em 15 minutos.</p>
      <p style="margin:26px 0;padding:18px;background:#f4f2ff;border-radius:12px;text-align:center;color:#3726aa;font-size:28px;font-weight:700;letter-spacing:6px">{{ .Token }}</p>
      <p style="line-height:1.6;color:#5f6b7a">Se você não criou uma conta no Nexame, ignore este e-mail.</p>
    </main>
  </body>
</html>
