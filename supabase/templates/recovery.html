<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;background:#eef2ff;font-family:Arial,sans-serif;color:#172033">

      <p style="margin:0 0 20px;color:#5b4bd8;font-size:22px;font-weight:700">Nexame</p>

      <p style="margin:28px 0"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#5b4bd8;border-radius:9px;padding:13px 20px;color:#ffffff;font-weight:700;text-decoration:none">Redefinir minha senha</a></p>
      <p style="line-height:1.6;color:#5f6b7a">Se não foi você, ignore este e-mail: sua senha atual permanecerá válida.</p>
    </main>
